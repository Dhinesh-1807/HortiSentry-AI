# HortiSentry Multi-Crop Class Normalization & Taxonomy Registry
# Maps original raw dataset labels to standardized canonical class names and biological disease types.

class_mappings:
  # --- TOMATO ---
  - crop: "tomato"
    canonical_class: "Healthy"
    original_label: "Tomato___healthy"
    disease_type: "healthy"

  - crop: "tomato"
    canonical_class: "Early_Blight"
    original_label: "Tomato___Early_blight"
    disease_type: "fungal"

  - crop: "tomato"
    canonical_class: "Late_Blight"
    original_label: "Tomato___Late_blight"
    disease_type: "fungal"

  - crop: "tomato"
    canonical_class: "Septoria_Leaf_Spot"
    original_label: "Tomato___Septoria_leaf_spot"
    disease_type: "fungal"

  - crop: "tomato"
    canonical_class: "Tomato_Bacterial_Spot"
    original_label: "Tomato___Bacterial_spot"
    disease_type: "bacterial"

  - crop: "tomato"
    canonical_class: "Tomato_Leaf_Mold"
    original_label: "Tomato___Leaf_Mold"
    disease_type: "fungal"

  - crop: "tomato"
    canonical_class: "Tomato_Spider_Mites"
    original_label: "Tomato___Spider_mites Two-spotted_spider_mite"
    disease_type: "pest"

  - crop: "tomato"
    canonical_class: "Tomato_Target_Spot"
    original_label: "Tomato___Target_Spot"
    disease_type: "fungal"

  - crop: "tomato"
    canonical_class: "Tomato_Yellow_Leaf_Curl_Virus"
    original_label: "Tomato___Tomato_Yellow_Leaf_Curl_Virus"
    disease_type: "viral"

  - crop: "tomato"
    canonical_class: "Tomato_Mosaic_Virus"
    original_label: "Tomato___Tomato_mosaic_virus"
    disease_type: "viral"

  # --- POTATO ---

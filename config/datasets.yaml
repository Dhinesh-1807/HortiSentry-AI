# HortiSentry Multi-Crop Dataset Source Registry
# Tracks metadata, licensing, source provenance, and download/preparation status for all agricultural datasets.

datasets:
  - dataset_id: "plantvillage_tomato"
    dataset_name: "PlantVillage Tomato Leaf Dataset"
    source: "PlantVillage Open Research Repository"
    source_url: "https://github.com/spMohanty/PlantVillage-Dataset"
    license: "CC BY 4.0 (Creative Commons Attribution 4.0 International)"
    crop: "tomato"
    image_type: "studio_foliage"
    real_or_synthetic: "real"
    number_of_images: 6271
    classes:
      - "Healthy"
      - "Early_Blight"
      - "Late_Blight"
      - "Septoria_Leaf_Spot"
    download_status: "downloaded"
    preparation_status: "verified"
    notes: "Baseline HortiSentry tomato dataset. Ingested and split in Phase 6. Must remain unmodified."


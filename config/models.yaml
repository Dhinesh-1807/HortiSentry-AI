# HortiSentry Model Registry & Provider Configuration
# Manages AI Vision Providers, Model Checkpoint References, and Model Readiness Statuses.

version: "1.0"

models:
  # --- DEDICATED TRAINED MODEL (STATE A) ---
  tomato-v1:
    crop: "tomato"
    provider: "pytorch"
    architecture: "MobileNetV3 Small"
    checkpoint: "ml/artifacts/tomato_v1.pt"
    classes: 4
    class_names:
      - "Healthy"
      - "Early_Blight"
      - "Late_Blight"
      - "Septoria_Leaf_Spot"
    test_accuracy: 0.9937
    macro_f1: 0.9927
    status: "production_benchmark"
    dedicated_model_active: true
    evidence_review_enabled: true

  # --- MULTIMODAL VISUAL ASSESSMENT + AI EVIDENCE ENGINE (STATE B) ---
  potato:
    crop: "potato"
    provider: "visual_assessment"
    architecture: "Multimodal Visual Symptom Analyzer"
